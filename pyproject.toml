[project]
name = "temporal-vault-k8s-local-demo"
version = "0.1.0"
description = "Local-first Temporal, Vault, Postgres, and Kubernetes demo"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "temporalio>=1.7.0",
    "structlog>=24.1.0",
    "hvac>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
