apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: temporal-vault-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: temporal-vault-demo-vault-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: temporal-vault-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: temporal-vault-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      enableServiceLinks: false
      containers:
        - name: vault
          image: hashicorp/vault:1.20
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
            - -dev-root-token-id=root
          ports:
            - name: http
              containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: temporal-vault-demo
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
