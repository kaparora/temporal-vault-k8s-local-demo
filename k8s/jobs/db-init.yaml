apiVersion: v1
kind: ConfigMap
metadata:
  name: order-demo-schema
  namespace: temporal-vault-demo
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS orders (
      id TEXT PRIMARY KEY,
      customer_id TEXT NOT NULL,
      status TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS order_items (
      order_id TEXT PRIMARY KEY REFERENCES orders(id),
      product_id TEXT NOT NULL,
      quantity INTEGER NOT NULL CHECK (quantity > 0),
      unit_price NUMERIC(10, 2) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS inventory (
      product_id TEXT PRIMARY KEY,
      quantity INTEGER NOT NULL CHECK (quantity >= 0),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS inventory_reservations (
      order_id TEXT PRIMARY KEY REFERENCES orders(id),
      product_id TEXT NOT NULL REFERENCES inventory(product_id),
      quantity INTEGER NOT NULL CHECK (quantity > 0),
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS payments (
      order_id TEXT PRIMARY KEY REFERENCES orders(id),
      amount NUMERIC(10, 2) NOT NULL,
      status TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS fulfilments (
      order_id TEXT PRIMARY KEY REFERENCES orders(id),
      status TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS notifications (
      order_id TEXT NOT NULL REFERENCES orders(id),
      notification_type TEXT NOT NULL,
      status TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      PRIMARY KEY (order_id, notification_type)
    );

    INSERT INTO inventory (product_id, quantity)
    VALUES ('WIDGET-001', 10)
    ON CONFLICT (product_id) DO UPDATE
    SET quantity = GREATEST(inventory.quantity, EXCLUDED.quantity),
        updated_at = NOW();

    INSERT INTO inventory (product_id, quantity)
    VALUES ('WIDGET-002', 0)
    ON CONFLICT (product_id) DO UPDATE
    SET quantity = 0,
        updated_at = NOW();

    DELETE FROM notifications WHERE order_id IN ('ORD-001', 'ORD-002', 'ORD-003');
    DELETE FROM fulfilments WHERE order_id IN ('ORD-001', 'ORD-002', 'ORD-003');
    DELETE FROM payments WHERE order_id IN ('ORD-001', 'ORD-002', 'ORD-003');
    DELETE FROM inventory_reservations WHERE order_id IN ('ORD-001', 'ORD-002', 'ORD-003');

    INSERT INTO orders (id, customer_id, status)
    VALUES
      ('ORD-001', 'CUST-001', 'PENDING'),
      ('ORD-002', 'CUST-002', 'PENDING'),
      ('ORD-003', 'CUST-003', 'PENDING')
    ON CONFLICT (id) DO UPDATE
    SET status = 'PENDING',
        updated_at = NOW();

    INSERT INTO order_items (order_id, product_id, quantity, unit_price)
    VALUES
      ('ORD-001', 'WIDGET-001', 1, 19.99),
      ('ORD-002', 'WIDGET-002', 1, 29.99),
      ('ORD-003', 'WIDGET-001', 1, 39.99)
    ON CONFLICT (order_id) DO UPDATE
    SET product_id = EXCLUDED.product_id,
        quantity = EXCLUDED.quantity,
        unit_price = EXCLUDED.unit_price;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: temporal-vault-demo
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: db-init
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command:
            - psql
            - -h
            - postgres
            - -U
            - temporal
            - -d
            - temporal
            - -f
            - /schema/schema.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: order-demo-schema
