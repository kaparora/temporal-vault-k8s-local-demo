apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: temporal-vault-demo
type: Opaque
stringData:
  POSTGRES_DB: temporal
  POSTGRES_USER: temporal
  POSTGRES_PASSWORD: temporal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: temporal-vault-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - temporal
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: temporal-vault-demo
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
